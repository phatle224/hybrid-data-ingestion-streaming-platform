# ============================================================================
# Docker Compose for Python Consumer
# Includes: Python CDC Consumer Service
# Usage: docker-compose -f docker-compose.consumer.yml up -d
# Note: Requires Kafka infrastructure and Debezium to be running first
# ============================================================================

services:
  python-consumer:
    build:
      context: ./services
      dockerfile: cdc_consumer/Dockerfile
    container_name: cdc_consumer
    restart: always
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-${DB_PASSWORD}}
      - DB_DATABASE=${DB_NAME_STAGING:-insuranceWarehouse}
      - TOPIC_PREFIX=source.source
      - LOG_LEVEL=DEBUG

networks:
  default:
    name: cdc-network
    external: true
